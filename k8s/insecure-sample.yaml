# DEMO / TEST MANIFEST: Insecure Deployment configuration for SecureGate validation
# This manifest illustrates multiple security anti-patterns that SecureGate will detect and BLOCK.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo-app
  namespace: default
  labels:
    app.kubernetes.io/name: insecure-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insecure-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insecure-demo-app
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: insecure-demo-app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add:
                - NET_ADMIN
                - SYS_PTRACE
          env:
            - name: DATABASE_PASSWORD
              value: supersecretpassword123
---
apiVersion: v1
kind: Service
metadata:
  name: insecure-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
