apiVersion: v1
kind: Namespace
metadata:
  name: securegate-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: securegate-demo-config
  namespace: securegate-demo
data:
  APP_ENV: production
---
apiVersion: v1
kind: Secret
metadata:
  name: securegate-demo-secrets
  namespace: securegate-demo
type: Opaque
stringData:
  DATABASE_PASSWORD: presentation-only-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securegate-demo
  namespace: securegate-demo
  labels:
    app.kubernetes.io/name: securegate-demo
    app.kubernetes.io/part-of: securegate
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: securegate-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securegate-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: hecticjankylanky23498/securegate-demo:1.0.0@sha256:030d9557dd9c47d135f4ecd985c9a2704464de5687465d11cfccd48bd0456bd7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: securegate-demo-config
                  key: APP_ENV
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securegate-demo-secrets
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: securegate-demo
  namespace: securegate-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: securegate-demo
  ports:
    - name: http
      port: 80
      targetPort: http
