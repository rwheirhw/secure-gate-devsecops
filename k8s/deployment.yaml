apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-app
  namespace: default
  labels:
    app.kubernetes.io/name: secure-app
    app.kubernetes.io/part-of: securegate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: secure-app
          image: registry.example.com/secure-app:1.0.0@sha256:ba5e911075d9e5b871c4c79401777f9859f518e95c1c8ec78fb564412ab4e7e6
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
